<title>SWAT Command — Barricade Prototype</title>
<style>
/* =====================================================================
   STYLE — dark command-center HUD (navy panels, cyan accents)
   ===================================================================== */
:root{--bg:#05080d;--panel:rgba(8,18,34,.86);--panel2:rgba(12,26,48,.92);--line:rgba(56,200,255,.22);--line2:rgba(56,200,255,.45);--cyan:#38c8ff;--cyan2:#7fe3ff;--txt:#d8e6f5;--dim:#7d93ad;--red:#ff3b4e;--amber:#ffb020;--green:#3ef0a0;--violet:#b48cff;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
.panel{position:fixed;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);box-shadow:0 0 0 1px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(127,227,255,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:10px}
.ph{display:flex;align-items:center;gap:8px;padding:9px 12px 7px;border-bottom:1px solid var(--line);font-weight:700;letter-spacing:.12em;font-size:11px;color:var(--cyan2);text-transform:uppercase}
.ph .sp{flex:1}
.ph small{color:var(--dim);letter-spacing:.05em;font-weight:600}
button{font:inherit;color:var(--txt);background:rgba(20,44,78,.7);border:1px solid var(--line2);border-radius:7px;padding:6px 10px;cursor:pointer;transition:background .15s,box-shadow .15s}
button:hover{background:rgba(32,70,120,.85);box-shadow:0 0 12px rgba(56,200,255,.25)}
button:disabled{opacity:.4;cursor:default;box-shadow:none}
button.on{background:linear-gradient(180deg,#1f6fd0,#124a8e);border-color:var(--cyan2);box-shadow:0 0 14px rgba(56,200,255,.45)}
.ib{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
/* top bar */
#top{top:calc(8px + var(--sat));left:8px;right:8px;height:50px;display:flex;align-items:center;gap:12px;padding:0 10px}
#top .logo{width:30px;height:34px;flex:none}
#top .op{font-weight:800;letter-spacing:.14em;color:#fff;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .sub{font-size:11px;color:var(--dim);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .grow{flex:1;min-width:0}
.stat{display:flex;flex-direction:column;align-items:flex-start;padding:0 10px;border-left:1px solid var(--line);white-space:nowrap}
.stat b{font-size:13px;color:#fff;letter-spacing:.06em}.stat span{font-size:9.5px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.12em;border:1px solid currentColor}
.pill.red{color:var(--red);background:rgba(255,59,78,.12)}.pill.amber{color:var(--amber);background:rgba(255,176,32,.12)}.pill.green{color:var(--green);background:rgba(62,240,160,.12)}.pill.cyan{color:var(--cyan);background:rgba(56,200,255,.12)}
/* left panel */
#left{top:calc(66px + var(--sat));left:8px;width:264px;bottom:96px;display:flex;flex-direction:column}
.scroll{overflow:auto;flex:1;padding:8px;scrollbar-width:thin;scrollbar-color:#24456e transparent}
.card{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid rgba(56,200,255,.16);background:rgba(10,24,44,.6);border-radius:9px;margin-bottom:7px;cursor:pointer;position:relative}
.card:hover{border-color:var(--line2)}.card.sel{border-color:var(--cyan2);box-shadow:0 0 0 1px rgba(127,227,255,.35),0 0 16px rgba(56,200,255,.25);background:rgba(18,48,86,.7)}
.card.down{opacity:.55}
.card .nm{font-weight:700;color:#fff;letter-spacing:.04em}.card .meta{font-size:11px;color:var(--dim)}
.card .info{margin-left:auto;width:26px;height:26px;padding:0;border-radius:50%;font-size:13px;flex:none}
.shield{position:relative;width:34px;height:38px;flex:none}
.shield svg{width:100%;height:100%;filter:drop-shadow(0 0 6px rgba(56,200,255,.6))}
.shield .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;padding-bottom:3px}
.shield .c{position:absolute;right:-5px;top:-4px;min-width:17px;height:17px;border-radius:9px;background:#fff;color:#06203f;font-weight:800;font-size:10px;display:flex;align-items:center;justify-content:center;border:1.5px solid #0a2a5a}
.pbadge{width:30px;height:30px;border-radius:50%;border:2px solid #9fb7d0;background:#1d2a3a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex:none}
.sec{font-size:10px;letter-spacing:.16em;color:var(--dim);font-weight:700;margin:10px 2px 6px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 2px}
.row .r{margin-left:auto;color:var(--dim);font-size:11px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.chip{font-size:10px;padding:1px 6px;border-radius:10px;background:rgba(56,200,255,.1);border:1px solid rgba(56,200,255,.25);color:var(--cyan2);white-space:nowrap}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f8fff,#7fe3ff);box-shadow:0 0 8px rgba(56,200,255,.6)}
/* right panel */
#right{top:calc(66px + var(--sat));right:8px;width:270px;bottom:96px;display:flex;flex-direction:column}
.sh{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan2);margin:2px 0 6px;font-weight:700}.loglite{max-height:110px;overflow:auto;font-size:11px;color:#bcd0e6;background:rgba(0,0,0,.25);border-radius:6px;padding:6px 8px;margin-top:8px}.loglite div{padding:1px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;padding:10px 12px 4px;font-size:12px}.kv span{color:var(--dim);letter-spacing:.06em;font-size:10.5px;text-transform:uppercase;align-self:center}.kv b{text-align:right;color:#fff;font-weight:700}
.ovwh{font-size:9.5px;letter-spacing:.14em;color:var(--dim);font-weight:700;margin:8px 12px -4px}
#ovw{width:calc(100% - 24px);margin:8px 12px;height:158px}
#ovw,#ovw2{display:block;cursor:pointer;touch-action:none;background:radial-gradient(circle at 50% 40%,#0c2342,#060f1e);border:1px solid var(--line);border-radius:8px}
#log{flex:1;overflow:auto;padding:4px 10px 10px;font-size:11.5px;scrollbar-width:thin;scrollbar-color:#24456e transparent}
#log div{padding:3px 0 3px 8px;border-left:2px solid rgba(56,200,255,.25);margin:3px 0;color:#bcd0e6}
#log .t{color:#4e6a8a;font-weight:700;margin-right:4px}
#log .pager{border-color:var(--violet);color:#d6c6ff}#log .bad{border-color:var(--red);color:#ffb3bb}#log .alert{border-color:var(--amber);color:#ffd88a}#log .good{border-color:var(--green);color:#a8ffd8}#log .intel{border-color:var(--cyan);color:#aeeaff}#log .system{border-color:#3c5372;color:#8aa2bf}
/* bottom action bar */
#bottom{left:8px;right:8px;bottom:calc(8px + var(--sab));height:80px;display:flex;align-items:center;gap:8px;padding:8px 10px}
#acts{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none;align-items:center;min-width:0}#acts::-webkit-scrollbar{display:none}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px;height:60px;padding:4px 6px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;flex:none}
.act .ic{font-size:19px;line-height:1;color:var(--cyan2)}.act.on .ic{color:#fff}
.act .ct{position:absolute;margin:-38px 0 0 38px;font-size:9px;background:#fff;color:#06203f;border-radius:7px;padding:0 4px}
.act{position:relative}
@media (min-width:821px) and (max-width:1600px){.act{min-width:52px;padding:4px 3px;letter-spacing:.03em;font-size:9.5px}}
#acts.more{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 46px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 46px),transparent)}
.vsep{width:1px;height:46px;background:var(--line);flex:none;margin:0 2px}
#exec{height:60px;min-width:150px;font-size:14px;font-weight:900;letter-spacing:.18em;background:linear-gradient(180deg,#ff8a1f,#d0500d);border-color:#ffc27a;color:#fff;box-shadow:0 0 18px rgba(255,138,31,.45);flex:none}
#exec small{display:block;font-size:9.5px;letter-spacing:.1em;font-weight:700;opacity:.9}
#exec:disabled{background:#3a2a20;box-shadow:none}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + var(--sab));background:rgba(4,12,24,.85);border:1px solid var(--line);padding:6px 14px;border-radius:20px;font-size:12px;color:var(--cyan2);pointer-events:none;white-space:nowrap;max-width:calc(100vw - 20px);overflow:hidden;text-overflow:ellipsis}
#toast{position:fixed;left:50%;top:calc(70px + var(--sat));transform:translateX(-50%);background:rgba(60,8,14,.92);border:1px solid var(--red);color:#ffd0d5;padding:8px 16px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:90vw;text-align:center}
#toast.show{opacity:1}#toast.ok{background:rgba(6,40,30,.92);border-color:var(--green);color:#c8ffe6}
#zoom{position:fixed;right:290px;bottom:104px;display:flex;flex-direction:column;gap:5px}
/* collapsible side panels */
.ptog{width:24px;height:24px;font-size:15px;font-weight:800;flex:none;color:var(--cyan2)}
#bmini{display:none}
#left.col{width:62px}#left.col .ph{padding:6px;justify-content:center}#left.col .ph>:not(.ptog){display:none}#left.col .ph .sp{display:none}
#left.col .scroll{padding:4px;overflow-x:hidden}#left.col .card{padding:4px;justify-content:center;margin-bottom:5px}#left.col .card>:not(.shield):not(.pbadge){display:none}
#left.col .row,#left.col #b-form{display:none}#left.col .sec{font-size:0;letter-spacing:0;margin:6px 0 4px}#left.col .sec:after{height:1px}
#right.col{width:190px;bottom:auto}#right.col>:not(.ph:first-child):not(#bmini){display:none}#right.col #bmini{display:block;padding:6px 10px 8px;font-size:11px}
#right.col .ph small{display:none}
#bmini .mr{display:flex;gap:6px;justify-content:space-between;padding:1px 0}#bmini .mr span{color:var(--dim);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}#bmini .mr b{color:#fff;text-align:right;font-size:11px}
#bmini .ml{margin-top:5px;padding-top:4px;border-top:1px solid var(--line);color:#bcd0e6;font-size:10.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}#bmini .ml i{font-style:normal;color:#4e6a8a;font-weight:700;margin-right:4px}
/* collapsible dialogs (brief / intel): shrink to a title bar so the map and controls stay usable */
.mtog{width:28px;height:28px;font-size:14px;margin-left:4px}
.modal.mini{background:transparent;pointer-events:none;align-items:flex-start;padding-top:calc(52px + var(--sat))}.modal.mini .dlg{pointer-events:auto;width:min(420px,100%)}.modal.mini .dlg>:not(.ph){display:none}
/* modals */
.modal{position:fixed;inset:0;background:rgba(2,6,12,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal.show{display:flex}
#m-enc{z-index:60;background:rgba(2,6,12,.45)}.dlg.enc{width:min(560px,100%)}.dlg.enc .body{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.enc-t{font-size:14px;line-height:1.45;color:#e8f1fb;margin:0 0 8px}.enc-r{font-size:12.5px;color:#ffd9a8;margin:4px 0;padding-left:8px;border-left:2px solid #c9792e}.enc-n{font-size:11px;color:var(--mut,#8aa)}
.enc-q{font-weight:800;color:#fff;margin:10px 0 6px}.enc-q span{display:block;font-weight:400;font-size:11px;color:#8fa6bf}
.enc-opts{display:flex;flex-direction:column;gap:6px}.enc-b{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:46px;padding:9px 12px;text-align:left;font-size:14px;border-radius:8px}
.enc-b b{flex:1;min-width:150px}.enc-b small{flex-basis:100%;font-size:11px;color:#8fa6bf}.enc-b.def{border-color:var(--cyan2);box-shadow:0 0 0 1px var(--cyan2) inset}.enc-b.back{justify-content:center;opacity:.85}
.enc-w{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:10px;background:rgba(120,150,180,.18);color:#cfe0f2;white-space:nowrap}
.enc-w.wVerylikely{background:rgba(40,170,90,.3);color:#b6f5cc}.enc-w.wLikely{background:rgba(60,150,90,.22);color:#c8f0d4}.enc-w.wPossible{background:rgba(200,170,60,.22);color:#f3e2a6}.enc-w.wUnlikely{background:rgba(210,110,50,.22);color:#f6c9a8}.enc-w.wVeryunlikely{background:rgba(200,60,60,.26);color:#f7b8b8}
@media (max-width:600px){#m-enc{padding:6px;align-items:flex-end}.dlg.enc{max-height:calc(100% - 12px)}.enc-b{min-height:52px;font-size:15px}}

.mm .mmb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;min-height:54px;width:100%}.mm .mmb b{font-size:14px}.mm .mmb span{font-size:11px;color:var(--dim);font-weight:400}.mm .mmb.on span{color:#dff}
.mmq{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}.mmg{gap:8px}
.lvrow{display:flex;align-items:center;gap:8px;font-size:12px;color:#bcd0e6}.lvrow label{min-width:70px}.lvrow input[type=range]{flex:1;min-width:80px;accent-color:var(--cyan2);height:28px}.lvrow input[type=number]{width:58px;background:#0b1622;color:#fff;border:1px solid var(--line);border-radius:6px;padding:5px;font:inherit;font-size:14px}
.mmt{font-size:11.5px;color:#bcd0e6;line-height:1.45;min-height:34px}
.lvbox{display:flex;gap:12px;align-items:center;border:1px solid var(--cyan2);border-radius:8px;padding:8px 10px;margin-bottom:10px;background:rgba(40,120,170,.12)}.lvn{font-size:11px;color:var(--dim);text-align:center;line-height:1}.lvn b{display:block;font-size:28px;color:#fff}
.lvbar{height:8px;background:#0b1622;border-radius:4px;overflow:hidden;margin:5px 0 3px;border:1px solid var(--line)}.lvbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan2),var(--green))}
.calls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.callc{display:flex;flex-direction:column;gap:3px;text-align:left;font-size:12px;color:#bcd0e6;padding:10px;font-weight:400}

<script>
/* =====================================================================
   MODULE 1 — CORE GAME RULES  (pure logic: no DOM, no canvas, no timers)
   ---------------------------------------------------------------------
   Everything that decides *what happens* lives here: seeded map
   generation (target house archetypes + neighborhood), units, line of
   sight, cover & exposure, orders, cruisers, ballistics, turn resolution,
   suspect AI, intel and win/lose. Renderer/UI only READ Core.state and
   call the public API at the bottom. Port this module 1:1 to GDScript/C#.
   Coordinates: integer grid cells (1 cell ≈ 1 m). Cell (x,y) centre = (x,y).
   ===================================================================== */
const Core = (function () {
'use strict';
/** Rear row behind the suspect house: rear street (road + sidewalk) and a row of back-neighbour lots whose yards meet the target's back yard. */
const REAR_CFG = { road: 4, walk: 2, depth: 18 }, REAR_OFF = 1 + REAR_CFG.road + REAR_CFG.walk + REAR_CFG.depth;
const MAP_W = 112, MAP_H = 71 + REAR_OFF, TICKS = 8, LOSE_DOWN = 3; // LOSE_DOWN: kept only as the 'heavy losses' warning threshold — the mission never auto-ends on losses or time
/* ---------- time display: logic stays turn-based; each executed turn = 30 s of scene time ---------- */
const TURN_SEC = 30;
function mmss(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
/** Duration of n turns as m:ss (e.g. 3 turns → '1:30'). */
function tDur(n) { return mmss(n * TURN_SEC); }
/** Rough duration of n turns in minutes (e.g. 3 turns → '1.5 min', 2 → '1 min'). */
function tMin(n) { const m = n * TURN_SEC / 60; return (Number.isInteger(m) ? m : m.toFixed(1)) + ' min'; }
/** Scene clock (time of day) at a turn/tick; S.clock0 = when SWAT was activated (from the brief). */
function clockAt(turn, tick) { const s = ((S && S.clock0) || 0) + turn * TURN_SEC + Math.round((tick || 0) * TURN_SEC / TICKS); const t = ((s % 86400) + 86400) % 86400, p = n => String(n).padStart(2, '0');
  return `${p(Math.floor(t / 3600))}:${p(Math.floor(t / 60) % 60)}:${p(t % 60)}`; }
/** Elapsed time since activation, m:ss. */
function elapsedAt(turn, tick) { return mmss(turn * TURN_SEC + (tick || 0) * TURN_SEC / TICKS); }

/* ---------- seeded RNG (mulberry32) ---------- */
function makeRng(seed) {
  let a = (seed >>> 0) || 1;
  const r = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);

$('help-dlg').innerHTML = `<div class="ph">How to Play<span class="sp"></span><button class="ib" data-close="m-help">✕</button></div><div class="body" style="font-size:12.5px;color:#bcd0e6">
 ${HB('Goal', `an armed suspect is barricaded in one of the houses. Contain it, gather intel, then talk him out or make a safe entry. The mission ends when he is <b>in custody</b> (surrender, arrest, or secured after being stopped) — or when you choose <b>⚑ Withdraw</b>. There is <b>no time limit</b> and the mission never ends early on losses; instead the debrief score takes major deductions for officers hit or killed, civilians hurt, hostages killed, an escape through the perimeter, or a withdrawal. The mission clock is information only.`)}
 ${HB('Score & withdrawing', `the debrief lists every bonus and deduction: resolving it (+${Core.SCORE.resolved}), a talked-out surrender (+${Core.SCORE.talked}), rescued casualties, a closed perimeter gap — and major deductions for each officer hit (${Core.SCORE.officerHit}) or killed (${Core.SCORE.officerLost}), civilians hurt (${Core.SCORE.civHurt}) or killed (${Core.SCORE.civKilled}), hostages hurt or killed (${Core.SCORE.hostageKilled}), a suspect who slips through the perimeter and has to be tracked down (${Core.SCORE.escape}), and withdrawing (${Core.SCORE.withdraw}). Grades: Medal of Valor ≥1000, Unit Commendation ≥650, Satisfactory ≥350, Needs Review ≥0, Board of Inquiry below 0. <b>⚑ Withdraw</b> in the top bar ends the mission without a resolution — you are offered it automatically if no officer is left able to act.`)}
 ${HB('Vision indoors', 'officers inside the house see into the next room through <b>open doors and doorways</b> (not through walls or closed doors): the cells in their sight line are revealed, lit while in view and dimmed once out of view. If the suspect has a line of sight to an officer, that officer sees him too — even when facing away.')}
 ${HB('Time', 'the game pauses while you plan. Select a unit and queue orders (dotted paths). Orders chain — e.g. Move → Breach → Flashbang → Clear. Optionally queue one Intel action, then press <b style="color:var(--amber)">EXECUTE</b>: everyone acts at once for <b>30 seconds</b> of mission time (8 steps of ~4 s). The <b>mission clock</b> in the top bar starts at 0:00 when SWAT is activated and advances 0:30 per EXECUTE; the radio log shows the time of day. ETAs, gas, breach and critical-care timers are shown in minutes / m:ss.')}
 ${HB('Mission brief & 911 call', 'every mission opens with a brief of what happened before SWAT was activated: the 911 call, what the first patrol units did, and anything known about the suspect. <b>Listen to the 911 call</b> (📋 button, or Intel → Review 911 Call) shows the transcript with times and can read it aloud (mute / skip). The caller ID or a family caller may give you his phone number. Reviewing is instant.')}
 ${HB('Perimeter on arrival', 'patrol cruisers start at the ends of the block or at the nearest intersection, keeping traffic out (striped <b>TRAFFIC BLOCKED</b> markers on the map and minimap) — moving one opens the street. Patrol officers may already be in good positions, or may have left a side of the house unwatched by accident, or bunched up at the front. Run Intel → <b>Status Check</b> (instant) for a roll call: it reveals which sides are watched and flags any gap. An unwatched side is how he slips out.')}
 ${HB('Officer down on arrival', `about ${Math.round(Core.SCENE_CFG.injury * 100)}% of calls a patrol officer was hit before SWAT arrived: injured and mobile, immobile and bleeding out with a critical countdown, or killed. A downed officer in the front yard is in the line of fire — plan the rescue (shield, cover, medic) before the timer runs out.`)}
${HB('Encounters (seeing the suspect)', 'whenever a team has <b>visual contact</b> with a suspect, the game pauses at the end of the turn (a half-turn) with one decision per suspect. The description is written fresh each turn from what the suspect is actually doing — aiming, weapon at the side, hands visible, hands in pockets, recording or calling on a phone, hands behind the back, turned away, hands hidden, behind cover, or only <b>heard</b> moving. Officers say how sure they are: <i>confident it is a gun</i>, <i>uncertain but it looks like a gun</i>, or <i>unknown item</i> — and they can be wrong (a phone can look like a pistol). Pick a response (voice commands, negotiate if a negotiator is on scene, hold and observe, taser, 40mm, flashbang, CS gas, shoot, withdraw), then pick the officer who does it (only those with the equipment, range and line of sight are listed). Each option shows a likelihood word — <b>Very likely · Likely · Possible · Unlikely · Very unlikely</b> — no percentages. Repeating a command can help (or harden him); a negotiator improves the odds. Every suspect has a personality (scared, intoxicated, in crisis, determined, compliant-but-stalling) that shapes the answer: comply, ignore, back deeper into the house, surrender after a delay, or open fire.')}
 ${HB('Armed and aiming', 'shooting is always justified and is not a prompt — it simply happens. About 3 times in 4 the suspect gets the first rounds off; a flashbang, CS gas or breaching charge that turn cuts that. Whenever a suspect fires at a team with a direct line, officers return fire automatically and a result box explains what happened.')}
 ${HB('Shots through the doorway', 'after a breach or a bang/gas throw a suspect may fire blindly at the threshold. You choose: <b>cancel the entry</b>, <b>continue in and return fire</b>, <b>work the doorway</b> from outside, or have <b>point and defense engage from the door frame</b>. This replaces the follow-up you picked in the "After this" menu.')}
 ${HB('Use of force review', 'a suspect in custody unhurt scores far more than any other outcome; a minor injury keeps 80% of the mission points and a fatal outcome only 33%. Firing on a suspect who is unarmed or complying cuts the mission points by 95% and the officer is placed on administrative leave for a 10-mission review, which can end in reassignment out of the unit (career roster; in a single mission it is shown in the debrief).')}
 ${HB('After this, the team will', 'when you finish a <b>Breach</b> (method chosen) or a <b>Flashbang / CS gas</b> throw (room tapped), a second menu asks what the team does once it resolves: <b>Hold position</b>, <b>Enter and clear</b>, <b>Limited penetration and hold</b> (a step or two inside, off the doorway line, then hold) or <b>Assess from doorway</b> (at the opening looking in, then hold). The follow-up runs the moment the action succeeds, in the same turn. Defaults: breach → assess, flashbang → enter and clear, CS → hold. <b>‹ Back</b> returns to the previous step, <b>✕ Cancel</b> removes the action. Keys: <kbd>1</kbd>–<kbd>4</kbd>, <kbd>Enter</kbd> = highlighted, <kbd>Esc</kbd> = cancel. If the breach fails, nothing follows.')}
${HB('After a room is cleared', 'when a team clears a room and has nothing else queued it <b>stacks up shoulder to shoulder on the wall that holds the nearest door</b> of that room, without crossing any doorway, point man nearest the door frame. Nobody stands in the opening.')}
${HB('Address labels', 'the suspect address is shown in <b style="color:#ff3b4e">RED</b> over the target house. In a <b>duplex</b> the other unit has its own address (two numbers apart, e.g. 412 and 414), shown in <b style="color:#3ddc84">GREEN</b> over that unit, so you can tell which door is the suspect\'s. Labels keep the same size at any zoom.')}
${HB('Patrol start positions', `patrol officers always start <b>off the suspect\'s lot</b>: on the street behind a car or cruiser, or behind hard cover beside or behind the house — at least ${Core.PATROL_CFG.minHouse} m from it, where he cannot see them from inside. That keeps them safe but means they often cannot see every window: check the gaps. Only a downed officer lies on the property — ${Math.round(Core.PATROL_CFG.downFront * 100)}% of the time in the front yard, otherwise beside or behind the house.`)}
 ${HB('Vehicle cover', `a car, van, cruiser or BearCat body blocks sight and fire. Someone <b>right behind it (within ${Core.VEH_CFG.lean} m)</b> can lean out and fire over or past it; anyone farther back cannot see or shoot through any part of the vehicle — this applies to him as well, so he cannot hit officers tucked behind a car from a distance either.`)}
 ${HB('Cover', 'every spot is checked against real sight lines from <i>each</i> window and exterior door. <b>Hard cover</b> (cruisers, parked cars, tree trunks, sheds, neighbor houses, utility boxes) stops rounds — hits are rare. <b>Concealment</b> (hedges, fences, mailboxes) hides you so he fires less often, but rounds go straight through. You can <b>move anywhere</b> — nothing snaps. Before you EXECUTE, an order whose end spot is in his line of fire is flagged <b style="color:var(--red)">⚠ EXPOSED</b> on the order list and the preview, and a route that crosses open ground is flagged <b style="color:var(--amber)">route exposed</b>; the move is still allowed. Automatic moves (take cover, fall back) still prefer cover. Shield on the unit: <span style="color:var(--green)">green</span> = hard cover, <span style="color:var(--amber)">amber</span> = concealment, <span style="color:var(--red)">red</span> = exposed. Planned routes are tinted red/amber where they cross his lines of fire.')}
 ${HB('Containment', 'contain the house by watching every side (4 corners, front, rear) from real cover — there are no map markers; choose your own spots. Out front there is little to hide behind, so drive a cruiser into the street and stand behind it (a parked street car can serve too). Sides and rear use the yard (sheds, trees, hedges) or the corners of the neighbor houses. A solid green shield badge = <b>HARD COVER</b>, a leaf = <b>CONCEALMENT</b>; zoom in to see what shields it. Where a yard has nothing to hide behind, the scene adds some (hedge row, trees, utility box). Patrol officers start behind cover; posts count as held when an officer is within ~2 m or an occupied cruiser within 3 m.')}
 ${HB('Suspect fire', 'each chance he gets he fires about <b>40%</b> of the time at officers outside and about <b>80%</b> at a team inside the house; exposed officers are his first choice, then cruiser drivers, then officers in cover. A <b>flashbang</b> (dazed: fire chance ×0.45, accuracy ×0.55) and <b>CS gas</b> (up to −65% fire chance, −60% accuracy) cut both. He picks ONE <b>primary target</b> per turn — the nearest officer he can see — and keeps firing at that officer until the next turn (no retargeting). Other members of that team only take rounds after the primary is down (about 30% per round, at most 2 such rounds). A team stacked at a doorway can only be hit in the <b>doorway pair</b> (point + defense) when he fires through that door. Officers on <i>Return fire</i> shoot back automatically — the <b>nearest 3</b> with a clear line, a ready weapon in range and not holding fire (each team member counts separately; the log lists who fired), as a snap shot at the muzzle flash (×0.8, patrol ×0.55); exposed patrol officers fall back to cover. Use the stance button to switch Return fire / Fire at will / Hold fire.')}
 ${HB('Shooting', 'Fire / Suppress, then hover or tap a target to see the hit chance and its breakdown (base, range, cover, visibility, skill, spotter, impairment). Pistols rarely hit, rifles are low, the sniper is best — especially when he is at a window. Suppress rarely hits but makes him duck.')}
 ${HB('Vehicles', 'a vehicle is driven only through the officer or team inside it: patrol officers or a team <b>Get In</b> (cruiser 2 seats, BearCat 10 — the large navy armored truck with a roof turret, unlocked in career), then select <i>their</i> chip and use <b>Drive</b>; the occupants ride with it. <b>Exit</b> on the <i>house side</i> (fast, exposed) or the <i>safe side</i> (behind the vehicle; a driver sliding over costs +1 tick); a move order also gets a team out. The cruiser windshield is weak — a driver can be hit; the BearCat is armored. An empty vehicle is just static cover.')}
 ${HB('Staging areas', 'there are two. <b>Primary staging</b> is at the equipment vehicle (SWAT truck): about 70% of paged officers arrive here, and all equipment is drawn and returned here. <b>Secondary staging</b> is on foot at the other end of the street (about 30% arrive there) — officers there can form a team and move at once, but carry only their personal weapons until they visit the equipment vehicle. A team must be formed from officers at the same staging area.')}
 ${HB('Officer loadout', 'every officer has <b>two hands</b>, a holstered handgun and a taser, and his long gun. Tap 🎒 on a member in the team dialog: the <b>hands slot</b> shows what is held. A rifle is held two-handed, slung, or fired one-handed (×0.6 accuracy). Shields always take one hand and cannot be slung. The ram is carried in one hand; on a ram breach the pistol is auto-holstered for both hands on the ram and redrawn after. Charges ride on the vest — drawing one takes time and hanging it needs a free hand. Flashbang and CS throws need both hands (sidearm auto-holstered, then redrawn). The medkit is packed; full first aid needs both hands. The 40mm launcher needs both hands, a Less-Lethal Specialist and has limited rounds. Holster, sling or switch costs no time, but that weapon is <b style="color:var(--amber)">NOT READY for one full turn</b> — no return fire or attacks with it. Gear is drawn only at the equipment vehicle, from a pool that grows with team level.')}
 ${HB('Body armor', `every officer — patrol and SWAT — wears <b>soft Level IIIA</b> torso armor: it stops handgun and shotgun rounds. About half of hits land on the torso; hits to arms, legs or head injure as before. A stopped round at very close range (≤${Core.ARMOR_CFG.bluntRange} cells) can still leave a <b>small blunt-impact injury</b> (mobile, low severity) — most often from a shotgun. <b>Plate Carriers</b> (rifle plates, worn slot) are issued individually from the pool: they unlock around career level 75 and every one of the 30 officers has one at level 100; they stop about ${Math.round(Core.ARMOR.plate.stops.rifle * 100)}% of rifle rounds to the torso. Draw / return plates in the loadout (🎒) at the equipment vehicle. The team card shows a 🦺 badge (PL = plates, IIIA = soft only).`)}
 ${HB('Ballistic shields', `one-hand items that <b>cannot be slung or packed</b>. The <b>IIIA shield</b> stops handgun and shotgun; the <b>Level III shield</b> (career ~70+) also stops ~${Math.round(Core.SHIELDS.shield3.stops.rifle * 100)}% of rifle rounds and fewer .308. Protection is only in the <b>frontal arc</b> and covers part of the body (${Math.round(Core.SHIELD_CFG.cover * 100)}%); teammates stacked behind the shield get a partial benefit (${Math.round(Core.SHIELD_CFG.stack * 100)}%). The team's default point carries the best shield available.`)}
 ${HB('Several suspects (fleeing-suspect calls)', `a suspect who fled into a vacant house may not be alone: 1–4 suspects (one is most common — ${Math.round(Core.MULTI_CFG.countW[0] * 100)}% / ${Math.round(Core.MULTI_CFG.countW[1] * 100)}% / ${Math.round(Core.MULTI_CFG.countW[2] * 100)}% / ${Math.round(Core.MULTI_CFG.countW[3] * 100)}%). The patrol report can be uncertain or under-count. Each suspect has a separate position, weapon, armor, mask and behavior (hiding, fleeing, fighting, ready to give up, or injured). The intel panel shows the count as <b>Unknown (N seen)</b> until every suspect has been seen and every room cleared. Negotiation works on the group, but individuals can break away. The call is only resolved when <b>every</b> suspect is in custody; each escape costs points.`)}
 ${HB('Rotating a phone', 'the map re-measures itself after a rotate (and again a moment later, since iOS reports stale sizes). It keeps the same spot centred and never stretches. If you had not moved the view, it re-frames the house.')}
 ${HB('Suspect body armor', `about ${Math.round(Core.ARMOR_CFG.suspect * 100)}% of suspects wear armor — mostly soft vests, occasionally rifle plates. You only learn it when he is seen wearing it or a hit is stopped (log: “The round appears to have been stopped by body armor”). Handgun rounds are stopped by a soft vest; rifles penetrate soft armor but plates stop most of them; the .308 precision rifle penetrates soft armor and has a reduced chance against plates. Hits outside the vest still count — in a window he shows mostly head and shoulders.`)}
 ${HB('Draco arm (BearCat)', `career level ~60 adds a <b>Draco Arm Kit</b> to the pool. Select a team of 2+ and tap <b>⚙ Install Draco</b>: they walk to the BearCat and mount it in ${Core.DRACO_CFG.installTurns} turns of work (progress bar on the vehicle). Installers are busy and more exposed and do not return fire; any other order interrupts the install (progress is kept). Once installed, select whoever is inside the BearCat and use <b>⚒ Draco Breach</b> on an exterior door or a window: the BearCat drives up and the claw rips it out — a door in one or two pulls (storm doors first, still faster than by hand), windows always. It is loud, takes the frame with it, and the crew stays under armor. The new opening is used for vision, gas and entry.`)}
 ${HB('Taser', `Taser order (team or patrol): an officer with a free(able) hand draws the taser one-handed — the suspect must be in view with a clear line within ~${Core.TASER_CFG.range} m. Odds are best up close (~${Math.round(Core.TASER_CFG.p * 100)}% at 1 m, lower with distance and against body armor) and it can fail. A hit incapacitates him for ~${Core.TASER_CFG.stunTurns} turns: move a team in to detain him.`)}
 ${HB('Less-lethal 40mm', `an LL-qualified officer with the launcher fires impact rounds: range ~${Core.LL_CFG.range} m, odds fall with range, about ${Math.round(Core.LL_CFG.noEffect * 100)}% of hits have no visible effect, a good hit stuns him ${Core.LL_CFG.stunTurns[0]}–${Core.LL_CFG.stunTurns[1]} turns. Each shot uses one round (shown in the loadout); out of rounds = order unavailable.`)}
 ${HB('Hand transitions', 'throwing a flashbang / CS needs <b>both hands</b>, the taser <b>one</b>, the 40mm launcher <b>both</b>. The officer automatically holsters or slings what he holds, uses the device, then re-draws his previous weapon — which is <b>not ready</b> until next turn (logged). A <b>ballistic shield cannot be slung or put down</b>: a shield holder keeps it and uses the taser in his free hand, but cannot fire the launcher (give the launcher to someone else in the loadout).')}
 ${HB('Lots, corner houses and alleys', `the suspect house usually shares its block with the neighbour houses on both sides — <b>no road between them</b>. About ${Math.round(Core.GEO_CFG.corner * 100)}% of maps are a <b>corner lot</b> with a side street on one side, and about ${Math.round(Core.GEO_CFG.alley * 100)}% have an <b>alley</b> behind the back yards.`)}
 ${HB('The block behind the house', 'the map includes the <b>rear row</b>: the back neighbours\' houses, their yards and the rear street behind the suspect house (back fences have gates). Their house corners and sheds are hard cover for rear containment, a sniper can take a perch in a rear house (marked <i>rear row</i>), and cruisers can use the rear street to close the back of the block. Zoom out (⤢ / overview) to see it.')}
 ${HB('Sniper overwatch', 'a team with a Marksman can take Overwatch on a perch in a neighbor house (window or roof) or a yard vantage point; the cone shows his sight-lines. A spotter raises his hit chance — a qualified <b>◆ Sniper Spotter</b> most, any other officer moderately — and spots the suspect at windows sooner. Perched snipers are very hard to hit.')}
 ${HB('CS gas', 'gas spreads room to room through open doors and broken windows and vents outdoors as a plume; you only see it where you have vision or intel. Deploying gas calls “Gas! Masks on” — donning takes a tick. Unmasked officers in gas are heavily impaired; masks cost a little vision and aim. Patrol have no masks: they cough, may fall back or panic — pull them out. The suspect may flee or give up… unless he has a gas mask (you only learn that when you see him).')}
 ${HB('Negotiation', 'Two negotiators arrive staggered. Open contact by <b>Call</b> (needs his number — from a neighbor interview, the 911 record or family), <b>PA Contact</b> from a cruiser or a bullhorn team (he may yell from a window — or shoot), or a <b>Throw Phone</b> tossed through an open door/broken window or carried in by the robot (can be blocked, shot or ignored). He can refuse, not answer or hang up. Once talking, pick one dialogue move per turn in Intel: Build Rapport, Active Listening, Concession, Status Check, Ultimatum.')}
 ${HB('Surrender walk-out', 'when he agrees, he walks to the ◎ walk-out spot next turn and kneels; the nearest unit takes custody. Some hide a weapon: set protocol first — teams in cover watching the spot, a shield team close, sniper overwatch and a PA/bullhorn giving commands — each cuts the ambush risk (shown in Intel).')}
 ${HB('Contain & call out', '<b>Call Out</b> over a PA orders him out. Low odds (~10–15%), better with full containment, gas and rapport; agitation lowers it.')}
 ${HB('Casualties', 'a hit person may be killed (memorial marker), injured but mobile (moves to cover and walks to EMS), or immobile (needs rescue). A ✚ marker shows the critical countdown (m:ss of mission time); you only see status with vision or a radio report. <b>First Aid</b> (Medic + medkit stabilises), <b>Rescue</b> drags to cover, <b>Evacuate</b> carries to the 🚑 EMS point, then transport to hospital. Three officers hit aborts the operation.')}
 ${HB('Breaching', 'Breach → tap a door → pick a method. <b>Charge</b> (Breacher only): hang it, back off to the safe-standoff ring, then it detonates (automatically, or choose “Hang only” and use Detonate later) — fastest and most reliable but very loud; anyone inside the ring is dazed. <b>Ram</b>: medium and loud. <b>Halligan pry</b>: quiet but slow. <b>Kick</b>: no gear, poor odds. Barricades and storm doors (shown once seen) make every method harder. Noise alerts the suspect.')}
 ${HB('Forces', 'patrol (P1–P4) are on scene — put them where they can watch the house from cover. At least one SWAT officer is <b>already at staging</b> when you take command — usually 1–3, sometimes a larger group; the rest are paged and arrive with staggered ETAs. Rarely (about 1 in 15) the <b>whole team arrives at once</b> because they were training together or clearing from another call — the brief and radio log say so. Press <b>Form Team</b>: tick officers at one staging area, pick the <b>POINT</b> and his <b>DEF</b> (defense) man and put the rest in order with ▲▼ — the stack and formations follow that order. Tap ⓘ (or a selected shield) for members, order, loadouts and transfers.')}
 ${HB('Formations', 'each team member is a <b>blue dot</b> (the lighter dot is the point man). The team adapts to where it is: a <b>cover line</b> along a car or wall outside (a line abreast in the open), at a door the <b>point</b> and <b>defense</b> officers stand at either side of the door frame (partly in the doorway) while the rest are <b>stacked on the wall</b> beside the opening, out of its line of fire; a <b>staggered column</b> on alternating walls in hallways and while moving; and inside a room the team spreads <b>along the walls</b> and into the corners (point on the near wall, the others fanned to the far walls), never in the middle of the room. The label under the dots names the formation when zoomed in.')}
 ${HB('Work Corner (slice the pie)', 'at a hallway corner, door frame or house corner, <b>◩ Work Corner</b> (<kbd>N</kbd>) edges the unit out in <b>45° cuts</b> — one cut every two ticks, each revealing more of the hidden area through the fog. It <b>stops the moment it sees the suspect</b> (THREAT in the log) or reports “corner clear”. While slicing only a sliver of the unit is exposed, so the suspect is less likely to fire at it and less likely to hit. Queue it like any order (it chains after a Move) and press EXECUTE; moving off the spot ends the slice. Patrol officers can work outside house corners but never step inside.')}
 ${HB('Main menu', 'the game opens on the main menu. <b>Quick Mission</b> plays one scenario with the <b>team level</b> you pick on the slider or number box (1–100, default 100): level 1 is a small basic team (4 officers, shields, ram, Halligan, medkit, bullhorn); every level adds people and gear up to level 100 — 30 personnel and every item in large counts. Quick Missions are never saved to the career. <b>New seed</b> picks a different scenario; <b>Career / Roster</b> and <b>How to play</b> open those screens.')}
 ${HB('Career Mode', 'starts at <b>team level 1</b>. Team XP is earned per action — breaching, clearing rooms, working corners, finding the suspect, closing the perimeter, contact and dialogue, first aid, rescue and evacuation, overwatch, flashbangs, taking custody — plus the mission result; enough XP raises the team level (personnel, gear and team size grow with it). Between missions the <b>dispatch screen</b> offers random calls with an estimated risk. In a career mission the ☰ menu has <b>☎ Call State SWAT Team</b>: hand the scene over, keep only the per-action XP (shown in the debrief), no mission-completion XP and a score deduction. Results save automatically in this browser; team level and XP are stored separately from the roster, so a damaged roster is regenerated without losing them. Officers still gain XP and rank, injured officers sit out missions, officers killed go to the memorial. <b>Export</b> a code (it starts with your level and XP, e.g. <kbd>SWATC3.L12-X3400-…</kbd>) or a file to move the career; older SWATC1/SWATC2 codes and saves import and upgrade automatically.')}
 ${HB('Call types', `each seed picks a call type (Quick Mission: choose one under <b>Call type</b>, or Random). The type is shown at the top of the brief, on the 911 record and on career dispatch cards. <b>Barricaded subject</b> — the standard call. <b>Mental health crisis</b> — low aggression, open to talking; the legal factor (discharge, warrant or interview-only) is in the brief. Bonus for resolving without force (+${Core.SCEN_TYPES.mental.bonus.noForce}) and for arranging an <b>EMS Evaluation</b> (Intel, +${Core.SCEN_TYPES.mental.bonus.ems}); the debrief notes a neutral risk flag. <b>Domestic</b> (firearm or violent variant) — his partner is at the perimeter: the <b>Partner Interview</b> gives the full layout, weapons, history and usually his number. <b>Fleeing suspect — vacant house</b> — nobody else inside, no family, little interest in talking; he escapes through any side nobody watches, fast — run a Status Check and close gaps early. <b>Neighbor dispute</b> — known armed; most hostile toward the neighbor's side of the house (keep officers off that side); the neighbor can be interviewed. <b>Parole absconder</b> (about ${Math.round(Core.SCEN_TYPES.parole.xw * 100)}% of calls) — patrol came to pick him up on a parole-violation warrant; the brief says how they know he is inside (seen going in, seen at a window, or a caller). One suspect, armed or not (he may have no firearm at all). He often hides in an <b>attic</b> or <b>basement</b>: he cannot be seen there until an officer, the robot or K9 is right next to the hatch, so clear every room. <b>Eviction / civil papers standoff</b> (about ${Math.round(Core.SCEN_TYPES.sovcit.xw * 100)}%) — he rejects the court's authority and argues every point (his own negotiation lines; call-outs work poorly). Long guns, body armor, gas masks and braced/reinforced doors are each +${Math.round(Core.SOVCIT_CFG.boost * 100)} points more likely (capped at ${Math.round(Core.SOVCIT_CFG.cap * 100)}%). <b>Fortified drug house</b> (about ${Math.round(Core.SCEN_TYPES.drughouse.xw * 100)}%, hard) — a narcotics warrant or a controlled buy gone wrong; no 911 call, the narcotics unit briefs you by radio. ${Core.MULTI_TYPES.drughouse.countW.findIndex(w => w > 0) + 1}–${Core.MULTI_TYPES.drughouse.countW.length} suspects with long guns, body armor possible (${Math.round(Core.MULTI_TYPES.drughouse.armor * 100)}% each). Exterior doors are <b>steel-reinforced and braced</b>: ram ×${Core.DOOR_MUL.steel.ram}, pry ×${Core.DOOR_MUL.steel.pry}, kick ×${Core.DOOR_MUL.steel.kick} — use an <b>explosive charge</b> or the <b>Draco arm</b>. About ${Math.round(Core.DRUG_CFG.barred * 100)}% of windows have <b>bars</b> (nobody climbs through; the Draco arm tears them out). ${Core.DRUG_CFG.cams[0]}–${Core.DRUG_CFG.cams[1]} <b>security cameras</b> (red cones) watch the approaches: an officer in a cone raises their agitation every turn — Intel → <b>Cut Power</b> turns them off (they notice). <b>Escaped inmates</b> (about ${Math.round(Core.SCEN_TYPES.inmates.xw * 1000) / 10}%) — one or two escapees forced their way into an occupied house; the family fled and called 911. Nobody else inside. They try to slip out early through any unwatched side — contain fast. Intel → <b>Family Interview (homeowner)</b> gives the full layout, the guns in the house and the exact count.`)}
 ${HB('Structures', `about ${Math.round(Core.STRUCT_CFG.duplex * 100)}% of calls are a <b>duplex</b> and ${Math.round(Core.STRUCT_CFG.trailer * 100)}% a <b>mobile home</b> (Quick Mission: choose under <b>Structure</b>). <b>Duplex</b> — two homes side by side sharing a <b>party wall</b> (thick line on the roof). He is on his side; the other unit (<b>Unit B</b>, tag on the roof) is a separate home whose residents may be in: Intel → <b>Evacuate Unit B</b> (about ${Core.DUPLEX_CFG.evacTurns} turns). In a long standoff (from turn ${Core.DUPLEX_CFG.breakFrom}) the chance grows every turn (${Math.round(Core.DUPLEX_CFG.base * 100)}% + ${Core.DUPLEX_CFG.per * 100}%/turn, max ${Math.round(Core.DUPLEX_CFG.cap * 100)}%, halved while a negotiator is on the phone) that he <b>breaks through the party wall</b> into Unit B. If residents are still inside it is a risk flag (${Core.DUPLEX_CFG.riskPen} score); evacuating them first earns +${Core.DUPLEX_CFG.evacBonus}. <b>Mobile home</b> (single- or double-wide, sometimes in a trailer park) — compact layout, flat metal roof, skirting and wooden steps at each door. <b>Thin walls</b>: hollow doors breach easily (kick ×${Core.DOOR_MUL.thin.kick}), officers outside next to his room can be heard and may be <b>shot at through the wall</b> (${Math.round(Core.TRAILER_CFG.wallShot * 100)}% a turn when he is agitated) — stay off the walls and use cover.`)}
