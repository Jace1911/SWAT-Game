<title>SWAT Command — Barricade Prototype</title>
<style>
/* =====================================================================
   STYLE — dark command-center HUD (navy panels, cyan accents)
   ===================================================================== */
:root{--bg:#05080d;--panel:rgba(8,18,34,.86);--panel2:rgba(12,26,48,.92);--line:rgba(56,200,255,.22);--line2:rgba(56,200,255,.45);--cyan:#38c8ff;--cyan2:#7fe3ff;--txt:#d8e6f5;--dim:#7d93ad;--red:#ff3b4e;--amber:#ffb020;--green:#3ef0a0;--violet:#b48cff;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
.panel{position:fixed;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);box-shadow:0 0 0 1px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(127,227,255,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:10px}
.ph{display:flex;align-items:center;gap:8px;padding:9px 12px 7px;border-bottom:1px solid var(--line);font-weight:700;letter-spacing:.12em;font-size:11px;color:var(--cyan2);text-transform:uppercase}
.ph .sp{flex:1}
.ph small{color:var(--dim);letter-spacing:.05em;font-weight:600}
button{font:inherit;color:var(--txt);background:rgba(20,44,78,.7);border:1px solid var(--line2);border-radius:7px;padding:6px 10px;cursor:pointer;transition:background .15s,box-shadow .15s}
button:hover{background:rgba(32,70,120,.85);box-shadow:0 0 12px rgba(56,200,255,.25)}
button:disabled{opacity:.4;cursor:default;box-shadow:none}
button.on{background:linear-gradient(180deg,#1f6fd0,#124a8e);border-color:var(--cyan2);box-shadow:0 0 14px rgba(56,200,255,.45)}
.ib{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
/* top bar */
#top{top:calc(8px + var(--sat));left:8px;right:8px;height:50px;display:flex;align-items:center;gap:12px;padding:0 10px}
#top .logo{width:30px;height:34px;flex:none}
#top .op{font-weight:800;letter-spacing:.14em;color:#fff;font-size:14px;white-space:nowrap}
#top .sub{font-size:11px;color:var(--dim);letter-spacing:.08em;white-space:nowrap}
#top .grow{flex:1;min-width:0}
.stat{display:flex;flex-direction:column;align-items:flex-start;padding:0 10px;border-left:1px solid var(--line);white-space:nowrap}
.stat b{font-size:13px;color:#fff;letter-spacing:.06em}.stat span{font-size:9.5px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.12em;border:1px solid currentColor}
.pill.red{color:var(--red);background:rgba(255,59,78,.12)}.pill.amber{color:var(--amber);background:rgba(255,176,32,.12)}.pill.green{color:var(--green);background:rgba(62,240,160,.12)}.pill.cyan{color:var(--cyan);background:rgba(56,200,255,.12)}
/* left panel */
#left{top:calc(66px + var(--sat));left:8px;width:264px;bottom:96px;display:flex;flex-direction:column}
.scroll{overflow:auto;flex:1;padding:8px;scrollbar-width:thin;scrollbar-color:#24456e transparent}
.card{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid rgba(56,200,255,.16);background:rgba(10,24,44,.6);border-radius:9px;margin-bottom:7px;cursor:pointer;position:relative}
.card:hover{border-color:var(--line2)}.card.sel{border-color:var(--cyan2);box-shadow:0 0 0 1px rgba(127,227,255,.35),0 0 16px rgba(56,200,255,.25);background:rgba(18,48,86,.7)}
.card.down{opacity:.55}
.card .nm{font-weight:700;color:#fff;letter-spacing:.04em}.card .meta{font-size:11px;color:var(--dim)}
.card .info{margin-left:auto;width:26px;height:26px;padding:0;border-radius:50%;font-size:13px;flex:none}
.shield{position:relative;width:34px;height:38px;flex:none}
.shield svg{width:100%;height:100%;filter:drop-shadow(0 0 6px rgba(56,200,255,.6))}
.shield .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;padding-bottom:3px}
.shield .c{position:absolute;right:-5px;top:-4px;min-width:17px;height:17px;border-radius:9px;background:#fff;color:#06203f;font-weight:800;font-size:10px;display:flex;align-items:center;justify-content:center;border:1.5px solid #0a2a5a}
.pbadge{width:30px;height:30px;border-radius:50%;border:2px solid #9fb7d0;background:#1d2a3a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex:none}
.sec{font-size:10px;letter-spacing:.16em;color:var(--dim);font-weight:700;margin:10px 2px 6px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 2px}
.row .r{margin-left:auto;color:var(--dim);font-size:11px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.chip{font-size:10px;padding:1px 6px;border-radius:10px;background:rgba(56,200,255,.1);border:1px solid rgba(56,200,255,.25);color:var(--cyan2);white-space:nowrap}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f8fff,#7fe3ff);box-shadow:0 0 8px rgba(56,200,255,.6)}
/* right panel */
#right{top:calc(66px + var(--sat));right:8px;width:270px;bottom:96px;display:flex;flex-direction:column}
.sh{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan2);margin:2px 0 6px;font-weight:700}.loglite{max-height:110px;overflow:auto;font-size:11px;color:#bcd0e6;background:rgba(0,0,0,.25);border-radius:6px;padding:6px 8px;margin-top:8px}.loglite div{padding:1px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;padding:10px 12px 4px;font-size:12px}.kv span{color:var(--dim);letter-spacing:.06em;font-size:10.5px;text-transform:uppercase;align-self:center}.kv b{text-align:right;color:#fff;font-weight:700}
.ovwh{font-size:9.5px;letter-spacing:.14em;color:var(--dim);font-weight:700;margin:8px 12px -4px}
#ovw{width:calc(100% - 24px);margin:8px 12px;height:158px}
#ovw,#ovw2{display:block;cursor:pointer;touch-action:none;background:radial-gradient(circle at 50% 40%,#0c2342,#060f1e);border:1px solid var(--line);border-radius:8px}
#log{flex:1;overflow:auto;padding:4px 10px 10px;font-size:11.5px;scrollbar-width:thin;scrollbar-color:#24456e transparent}
#log div{padding:3px 0 3px 8px;border-left:2px solid rgba(56,200,255,.25);margin:3px 0;color:#bcd0e6}
#log .t{color:#4e6a8a;font-weight:700;margin-right:4px}
#log .pager{border-color:var(--violet);color:#d6c6ff}#log .bad{border-color:var(--red);color:#ffb3bb}#log .alert{border-color:var(--amber);color:#ffd88a}#log .good{border-color:var(--green);color:#a8ffd8}#log .intel{border-color:var(--cyan);color:#aeeaff}#log .system{border-color:#3c5372;color:#8aa2bf}
/* bottom action bar */
#bottom{left:8px;right:8px;bottom:calc(8px + var(--sab));height:80px;display:flex;align-items:center;gap:8px;padding:8px 10px}
#acts{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none;align-items:center;min-width:0}#acts::-webkit-scrollbar{display:none}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px;height:60px;padding:4px 6px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;flex:none}
.act .ic{font-size:19px;line-height:1;color:var(--cyan2)}.act.on .ic{color:#fff}
.act .ct{position:absolute;margin:-38px 0 0 38px;font-size:9px;background:#fff;color:#06203f;border-radius:7px;padding:0 4px}
.act{position:relative}
@media (min-width:821px) and (max-width:1600px){.act{min-width:52px;padding:4px 3px;letter-spacing:.03em;font-size:9.5px}}
#acts.more{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 46px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 46px),transparent)}
.vsep{width:1px;height:46px;background:var(--line);flex:none;margin:0 2px}
#exec{height:60px;min-width:150px;font-size:14px;font-weight:900;letter-spacing:.18em;background:linear-gradient(180deg,#ff8a1f,#d0500d);border-color:#ffc27a;color:#fff;box-shadow:0 0 18px rgba(255,138,31,.45);flex:none}
#exec small{display:block;font-size:9.5px;letter-spacing:.1em;font-weight:700;opacity:.9}
#exec:disabled{background:#3a2a20;box-shadow:none}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + var(--sab));background:rgba(4,12,24,.85);border:1px solid var(--line);padding:6px 14px;border-radius:20px;font-size:12px;color:var(--cyan2);pointer-events:none;white-space:nowrap;max-width:calc(100vw - 20px);overflow:hidden;text-overflow:ellipsis}
#toast{position:fixed;left:50%;top:calc(70px + var(--sat));transform:translateX(-50%);background:rgba(60,8,14,.92);border:1px solid var(--red);color:#ffd0d5;padding:8px 16px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:90vw;text-align:center}
#toast.show{opacity:1}#toast.ok{background:rgba(6,40,30,.92);border-color:var(--green);color:#c8ffe6}
#zoom{position:fixed;right:290px;bottom:104px;display:flex;flex-direction:column;gap:5px}
/* modals */
.modal{position:fixed;inset:0;background:rgba(2,6,12,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal.show{display:flex}
.dlg.wide{width:min(860px,100%)}
.tr{display:grid;grid-template-columns:62px 78px 1fr;gap:6px;padding:4px 6px;border-radius:5px;font-size:12.5px}.tr .tt{color:var(--dim);font-variant-numeric:tabular-nums}.tr .who{font-weight:800;color:var(--cyan2)}.tr.c .who{color:var(--amber)}.tr.n{color:var(--dim);font-style:italic}.tr.n .who{color:var(--dim)}.tr.on{background:rgba(43,140,255,.18)}
.tl{border-left:2px solid var(--line2);margin:4px 0 4px 6px;padding-left:10px;font-size:12px}.tl div{margin:3px 0}.tl b{color:#fff;font-variant-numeric:tabular-nums}
.warnbox{border:1px solid var(--red);background:rgba(255,60,60,.1);border-radius:6px;padding:7px 10px;margin:8px 0;font-size:12.5px}
.ctab{width:100%;border-collapse:collapse;font-size:12px}.ctab td,.ctab th{padding:4px 5px;border-bottom:1px solid var(--line);text-align:left}.ctab th{color:var(--dim);font-weight:600;font-size:10.5px;letter-spacing:.05em}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}.ucard{border:1px solid var(--line2);border-radius:6px;padding:7px 8px;font-size:11.5px;color:#bcd0e6}.ucard b{color:#fff;display:block;font-size:12.5px}.ucard.own{border-color:var(--green)}.ucard button{margin-top:5px;width:100%}
#cc-code{width:100%;min-height:58px;font:11px monospace;background:rgba(6,16,30,.8);color:#cfe;border:1px solid var(--line2);border-radius:6px;padding:6px;box-sizing:border-box}
.rec{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}.rec div{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:11px;color:var(--dim)}.rec b{display:block;color:#fff;font-size:16px}
@media (max-width:700px){.tr{grid-template-columns:52px 62px 1fr;font-size:12px}.ctab .hm3{display:none}}
.dlg{width:min(640px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;position:relative}
.dlg .body{overflow:auto;padding:12px 14px}
.dlg input[type=text]{font:inherit;font-weight:800;font-size:16px;letter-spacing:.06em;color:#fff;background:rgba(6,16,30,.8);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;width:160px}
table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;font-size:10px;color:var(--dim);letter-spacing:.12em;font-weight:700;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--line)}td{padding:6px;border-bottom:1px solid rgba(56,200,255,.08);vertical-align:middle}
select{font:inherit;font-size:11.5px;color:var(--txt);background:#0b1b33;border:1px solid var(--line2);border-radius:6px;padding:4px}
.eq{display:grid;grid-template-columns:1fr auto auto auto auto;gap:6px 8px;align-items:center;font-size:12px}
.eq .q{font-weight:800;color:#fff;min-width:18px;text-align:center}.eq .a{color:var(--dim);font-size:11px}.eq button{width:28px;height:26px;padding:0}
.note{font-size:11px;color:var(--amber);margin:6px 0}
.big{font-size:28px;font-weight:900;letter-spacing:.14em;text-align:center;margin:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmd{text-align:left;padding:10px;display:block;width:100%}.cmd b{display:block;color:#fff;letter-spacing:.06em}.cmd span{font-size:11px;color:var(--dim)}.cmd em{font-size:10.5px;color:var(--amber);font-style:normal}
#ticker,#chips,#mtabs{display:none}
.x{position:absolute;right:8px;top:6px}
kbd{font:600 10.5px ui-monospace,monospace;background:#0b1b33;border:1px solid var(--line2);border-radius:4px;padding:0 4px}

/* breach method popup + aim breakdown + floating overview (phone) */
#pop{position:fixed;display:none;z-index:35;width:270px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:10px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#pop.show{display:block}
#pop .pt{font-weight:800;color:#fff;font-size:12px;margin:0 2px 6px}#pop .pt span{display:block;font-weight:600;font-size:10.5px;color:var(--dim)}
#pop button{display:block;width:100%;text-align:left;margin:4px 0;padding:6px 8px}#pop button b{display:block;font-size:12px;color:#fff}#pop button small{font-size:10.5px;color:var(--cyan2)}
#pop .pn,#aimbox .pn{font-size:10px;color:var(--amber);margin-top:6px}
#aimbox{position:fixed;display:none;z-index:34;left:50%;transform:translateX(-50%);top:calc(70px + var(--sat));width:300px;max-width:calc(100vw - 16px);background:rgba(4,12,24,.92);border:1px solid var(--line2);border-radius:9px;padding:7px 10px;pointer-events:none;font-size:11px}
#aimbox.show{display:block}
#aimbox .pt{font-weight:800;color:var(--cyan2);letter-spacing:.08em;display:flex;align-items:center;margin-bottom:3px}#aimbox .pt b{margin-left:auto;font-size:17px;color:#fff}
#aimbox .pr{display:flex;gap:6px;align-items:baseline;color:#bcd0e6}#aimbox .pr span{width:52px;color:var(--dim);text-transform:uppercase;font-size:9.5px;letter-spacing:.08em}#aimbox .pr i{flex:1;font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#aimbox .pr b{color:#fff}
#ovwf{display:none;right:6px;width:200px;padding:4px;z-index:25}#ovwf.show{display:block}#ovw2{width:100%;height:auto;border-radius:6px}
/* ---------- phone layout ---------- */
@media (max-width:760px){

<script>
/* =====================================================================
   MODULE 1 — CORE GAME RULES  (pure logic: no DOM, no canvas, no timers)
   ---------------------------------------------------------------------
   Everything that decides *what happens* lives here: seeded map
   generation (target house archetypes + neighborhood), units, line of
   sight, cover & exposure, orders, cruisers, ballistics, turn resolution,
   suspect AI, intel and win/lose. Renderer/UI only READ Core.state and
   call the public API at the bottom. Port this module 1:1 to GDScript/C#.
   Coordinates: integer grid cells (1 cell ≈ 1 m). Cell (x,y) centre = (x,y).
   ===================================================================== */
const Core = (function () {
'use strict';
const MAP_W = 112, MAP_H = 72, TICKS = 8, LOSE_DOWN = 3, TURN_LIMIT = 30;
/* ---------- time display: logic stays turn-based; each executed turn = 30 s of scene time ---------- */
const TURN_SEC = 30;
function mmss(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
/** Duration of n turns as m:ss (e.g. 3 turns → '1:30'). */
function tDur(n) { return mmss(n * TURN_SEC); }
/** Rough duration of n turns in minutes (e.g. 3 turns → '1.5 min', 2 → '1 min'). */
function tMin(n) { const m = n * TURN_SEC / 60; return (Number.isInteger(m) ? m : m.toFixed(1)) + ' min'; }
/** Scene clock (time of day) at a turn/tick; S.clock0 = when SWAT was activated (from the brief). */
function clockAt(turn, tick) { const s = ((S && S.clock0) || 0) + turn * TURN_SEC + Math.round((tick || 0) * TURN_SEC / TICKS); const t = ((s % 86400) + 86400) % 86400, p = n => String(n).padStart(2, '0');

/** Elapsed time since activation, m:ss. */
function elapsedAt(turn, tick) { return mmss(turn * TURN_SEC + (tick || 0) * TURN_SEC / TICKS); }

/* ---------- seeded RNG (mulberry32) ---------- */
function makeRng(seed) {

  r.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  return r;
}

/* ---------- static data ---------- */
const EQUIP = {
  shield:     { name: 'Ballistic Shield',      short: 'Shield',   pool: 2,  desc: 'Reduces chance of an officer going down when engaged.' },

  halligan:   { name: 'Halligan Bar',          short: 'Halligan', pool: 3,  desc: 'Pry or kick-assist. Quieter but slowest; must pry a storm door first.' },

  bang:       { name: 'Flashbang',             short: 'Flashbang',pool: 10, desc: 'Disorients occupants of a room for several ticks.' },
  gas:        { name: 'CS Gas Canister',       short: 'CS Gas',   pool: 4,  desc: 'Room becomes uninhabitable; suspect may surrender or flee.' },
  lesslethal: { name: 'Less-Lethal Launcher',  short: '40mm LL',  pool: 2,  desc: 'Can incapacitate a hostile suspect; launches gas through windows.' },
  polecam:    { name: 'Mirror / Pole Camera',  short: 'Pole Cam', pool: 2,  desc: 'Peek under a door into the next room without opening it.' },
  drone:      { name: 'Micro Drone',           short: 'Drone',    pool: 1,  desc: 'Fast flying scout. Needs a tech operator.' },
  robot:      { name: 'Ground Robot',          short: 'Robot',    pool: 1,  desc: 'Tracked camera robot. Needs a tech operator.' },

  bullhorn:   { name: 'Bullhorn',              short: 'Bullhorn', pool: 2,  desc: 'Portable loudspeaker: PA contact, call-outs and walk-out commands (cruisers have a built-in PA).' },
};
const SPECS = {
  leader:     { name: 'Team Leader', icon: '★', desc: '+ team coordination' },
  point:      { name: 'Point',       icon: '▲', desc: 'First in; lowers ambush risk' },
  breacher:   { name: 'Breacher',    icon: '⚒', desc: 'Better at every manual breach; the only one who can hang explosive charges' },
  marksman:   { name: 'Marksman / Sniper', icon: '◎', desc: 'Precision rifle; can take Overwatch in a neighbor house. Best odds vs a suspect at a window' },
  negotiator: { name: 'Negotiator',  icon: '☎', desc: 'Runs contact & dialogue from the command post; a second one coaches (+10%)' },
  k9:         { name: 'K9 Handler',  icon: '🐾', desc: 'Dog detects suspect through walls' },
  medic:      { name: 'Medic',       icon: '✚', desc: 'Full first aid with a medkit — stabilises casualties' },
  tech:       { name: 'Tech / Robot Op', icon: '⌬', desc: 'Operates drone & robot' },
};
/* Extra qualifications (shown in member detail). */
const QUALS = { spotter: { name: 'Sniper Spotter', icon: '◆', desc: 'Trained observer: biggest hit-chance bonus when paired with a sniper, spots the suspect at windows sooner' } };
/* Officer weapons. range = max effective cells; base = hit chance at point blank vs a fully exposed target. */
const WEAPONS = {
  pistol: { name: 'Pistol',          short: 'Pistol', range: 18, base: 0.10 },
  rifle:  { name: 'Patrol / Carbine Rifle', short: 'Rifle', range: 36, base: 0.20 },
  sniper: { name: 'Precision Rifle', short: 'Precision', range: 80, base: 0.42 },
};
/* Suspect weapons (seeded). */
const SUSPECT_WEAPONS = {
  handgun: { name: 'handgun', range: 24, base: 0.34 },
  rifle:   { name: 'hunting rifle', range: 36, base: 0.30 },
  shotgun: { name: 'shotgun', range: 16, base: 0.42 },
};
const STANCES = { return: 'Return fire', free: 'Fire at will', hold: 'Hold fire' };
const TEAM_NAMES = ['Alpha', 'Bravo', 'Charlie', 'Delta', 'Echo', 'Foxtrot'];
const LAST = ['Reyes','Kim','Novak','Okafor','Brennan','Castillo','Haddad','Lindqvist','Morales','Tran','Walsh','Diaz','Petrov','Hughes','Sato','Mensah','Kowalski','Rivera'];
const PATROL = ['Miller','Grant','Shah','Ortiz','Becker'];
const OPS = ['NIGHTFALL','IRON GATE','BLUE HERON','STONEWALL','SILENT KEY','COLD HARBOR','NORTH STAR','GLASS HOUSE','BLACKWOOD','HALCYON'];
const STREETS = ['Maple', 'Oak Hollow', 'Linden', 'Birch', 'Willow Creek', 'Juniper', 'Aspen', 'Cedar Ridge', 'Elm', 'Sycamore'];
const COVER_NAMES = ['', 'tree', 'hedge', 'parked car', 'shed', 'neighbor house', 'mailbox', 'low wall', 'fence', 'SWAT truck', 'garage', 'utility box'];

let S = null;   // the whole game state (serialisable except Map/typed arrays)

/* ---------- grid helpers ---------- */
const idx = (x, y) => y * MAP_W + x;
const inb = (x, y) => x >= 0 && y >= 0 && x < MAP_W && y < MAP_H;
const roomAt = (x, y) => inb(x, y) ? S.room[idx(x, y)] : -1;
const ek = (ax, ay, bx, by) => ax === bx ? 'h,' + ax + ',' + Math.max(ay, by) : 'v,' + Math.max(ax, bx) + ',' + ay;
const E_OPEN = { t: 'O' }, E_WALL = { t: 'X' }, E_FENCE = { t: 'F' };
function edge(ax, ay, bx, by) { const e = S.edges.get(ek(ax, ay, bx, by)); if (e) return e; return roomAt(ax, ay) === roomAt(bx, by) ? E_OPEN : E_WALL; }
function seeE(ax, ay, bx, by) { const e = edge(ax, ay, bx, by); return e.t === 'O' || e.t === 'F' || e.t === 'W' || (e.t === 'D' && e.d.state !== 'closed'); }
function passE(e, o) {
  if (e.t === 'O') return true;
  if (e.t === 'F') return !!o.fly;
  if (e.t === 'W') return !!(o.fly && e.w.broken);
  if (e.t === 'D') { const d = e.d; if (d.state !== 'closed') return true; if (o.assume && o.assume.has(d.id)) return true;
    if (o.suspect && !d.exterior) return true; if (o.canOpen && !d.locked && !d.barricaded) return true; if (o.allDoors) return true; }
  return false;
}
function cellOk(x, y, o) {
  if (!inb(x, y)) return false;
  const c = idx(x, y);
  if (o.drive) return !!S.drive[c] && !carClash(x, y, o.self);
  if (!o.fly && (S.block[c] || S.dyn[c])) return false;
  if (o.fly && S.opaque[c]) return false;
  if (o.outdoor && S.room[c] >= 0) return false;
  if (o.avoidSuspect && suspectActive() && S.suspect.x === x && S.suspect.y === y) return false;
  return true;
}
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const cheb = (ax, ay, bx, by) => Math.max(Math.abs(ax - bx), Math.abs(ay - by));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- Dijkstra pathfinding (8-dir, no corner cutting) ----------
   o.expo: add a cost for outdoor cells exposed to the house's windows/doors,
   so officers route around lines of fire instead of across them. */
function heapQ() { const h = []; return { h,
  push(c, k) { h.push([k, c]); let i = h.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (h[p][0] <= h[i][0]) break; [h[p], h[i]] = [h[i], h[p]]; i = p; } },
  pop() { const top = h[0], last = h.pop(); if (h.length) { h[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < h.length && h[l][0] < h[m][0]) m = l; if (r < h.length && h[r][0] < h[m][0]) m = r; if (m === i) break; [h[m], h[i]] = [h[i], h[m]]; i = m; } } return top; } }; }
function stepCost(x, y, dx, dy, o) {
  const nx = x + dx, ny = y + dy;
  if (!cellOk(nx, ny, o)) return -1;
  let cost = 1;
  if (dx && dy) {
    if (!cellOk(x + dx, y, o) || !cellOk(x, y + dy, o)) return -1;
    if (!o.drive && (!passE(edge(x, y, x + dx, y), o) || !passE(edge(x + dx, y, nx, ny), o) || !passE(edge(x, y, x, y + dy), o) || !passE(edge(x, y + dy, nx, ny), o))) return -1;
    cost = 1.414;
  } else if (!o.drive) { const e = edge(x, y, nx, ny); if (!passE(e, o)) return -1; if (e.t === 'D' && e.d.state === 'closed') cost += 1.5; }
  if (o.expo && S.expo) { const c = idx(nx, ny); if (S.room[c] < 0) cost += Math.min(3, S.expo[c]) * 2.2; }
  return cost;
}
function findPath(sx, sy, goal, o) {
  if (goal(sx, sy)) return [];
  const N = MAP_W * MAP_H, D = new Float64Array(N).fill(1e9), P = new Int32Array(N).fill(-1), q = heapQ();
  const s = idx(sx, sy); D[s] = 0; q.push(s, 0);
  while (q.h.length) {
    const [k, c] = q.pop(); if (k > D[c]) continue;
    const x = c % MAP_W, y = (c / MAP_W) | 0;
    if (c !== s && goal(x, y)) { const out = []; let p = c; while (p !== s) { out.push([p % MAP_W, (p / MAP_W) | 0]); p = P[p]; } return out.reverse(); }
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue; const sc = stepCost(x, y, dx, dy, o); if (sc < 0) continue;
      const n = idx(x + dx, y + dy), nd = k + sc; if (nd < D[n]) { D[n] = nd; P[n] = c; q.push(n, nd); }

}
/** Bounded Dijkstra: returns cost field (1e9 = unreachable) up to maxCost. */
function reach(sx, sy, o, maxCost) {
  const N = MAP_W * MAP_H, D = new Float64Array(N).fill(1e9), q = heapQ(); const s = idx(sx, sy); D[s] = 0; q.push(s, 0);
  while (q.h.length) { const [k, c] = q.pop(); if (k > D[c]) continue; const x = c % MAP_W, y = (c / MAP_W) | 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { if (!dx && !dy) continue; const sc = stepCost(x, y, dx, dy, o); if (sc < 0) continue;
      const n = idx(x + dx, y + dy), nd = k + sc; if (nd <= maxCost && nd < D[n]) { D[n] = nd; q.push(n, nd); } } }
  return D;
}

/* ---------- line of sight / line of fire ----------
   losEx → { v: 0 blocked | 1 clear | 2 clear through glass, cov: 0 none | 1 soft | 2 hard }
   cov = best cover between the two points within 2.6 m of the TARGET (b):
   an officer crouched behind a car/tree/fence close to him. */
function losEx(ax, ay, bx, by, wantCov) {
  const dx = bx - ax, dy = by - ay, steps = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) * 3);

  for (let i = 1; i <= steps; i++) {
    const t = i / steps, nx = Math.round(ax + dx * t), ny = Math.round(ay + dy * t);
    if (nx === cx && ny === cy) continue;
    const fin = nx === bx && ny === by;
    if (nx !== cx && ny !== cy) {
      const p1 = seeE(cx, cy, nx, cy) && seeE(nx, cy, nx, ny), p2 = seeE(cx, cy, cx, ny) && seeE(cx, ny, nx, ny);
      if (!p1 && !p2) return { v: 0, cov };
      const ea = p1 ? edge(cx, cy, nx, cy) : edge(cx, cy, cx, ny), eb = p1 ? edge(nx, cy, nx, ny) : edge(cx, ny, nx, ny);

      if ((ea.t === 'F' || eb.t === 'F') && near(nx, ny)) cov = Math.max(cov, 1);
      // squeezing diagonally past an opaque corner is blocked
      if (S.opaque[idx(nx, cy)] && S.opaque[idx(cx, ny)]) return { v: 0, cov };
    } else { if (!seeE(cx, cy, nx, ny)) return { v: 0, cov }; const e = edge(cx, cy, nx, ny); if (e.t === 'W') glass = true; if (e.t === 'F' && near(nx, ny)) cov = Math.max(cov, 1); }
    const c = idx(nx, ny);
    if (!fin) { if (S.opaque[c]) return { v: 0, cov };
      if (wantCov && near(nx, ny)) { const k = S.dyn[c] && !COV_STATIC ? 2 : S.cov[c]; if (k > cov) cov = k; } }
    cx = nx; cy = ny;

function los(ax, ay, bx, by) { return losEx(ax, ay, bx, by, false).v; }

/* =====================================================================
   MAP GENERATION 1/2 — TARGET HOUSE (seeded archetypes)
   Archetypes: ranch (attached garage), colonial (detached garage),
   L-shaped (rear wing), split-entry (tuck-under garage), bungalow.
   Each footprint is cut into zones:
     private – bedrooms + bath off a central hallway
     public  – living (front) / kitchen / dining
     wing    – extra bedroom / office / den
   Doors are placed on shared walls, a union-find pass guarantees every
   room is connected, then exterior doors and windows are added.
   ===================================================================== */
function segs(r, len) { const out = []; let rem = len; while (rem > 6) { const s = r.int(3, Math.min(6, rem - 3)); out.push(s); rem -= s; } out.push(rem); return out; }

 ${HB('Goal', `an armed suspect is barricaded in one of the houses. Contain it, gather intel, then talk him out or make a safe entry. Win when he is <b>detained</b> or <b>surrenders</b>. You lose if ${Core.LOSE_DOWN} officers are hit and down, he escapes the perimeter, or ${Core.tMin(Core.TURN_LIMIT)} of mission time pass.`)}
 ${HB('Time', 'the game pauses while you plan. Select a unit and queue orders (dotted paths). Orders chain — e.g. Move → Breach → Flashbang → Clear. Optionally queue one Intel action, then press <b style="color:var(--amber)">EXECUTE</b>: everyone acts at once for <b>30 seconds</b> of mission time (8 steps of ~4 s). The <b>mission clock</b> in the top bar starts at 0:00 when SWAT is activated and advances 0:30 per EXECUTE; the radio log shows the time of day. ETAs, gas, breach and critical-care timers are shown in minutes / m:ss.')}

 ${HB('Suspect fire', 'he targets exposed officers first, then cruiser drivers, then officers in cover. Officers on <i>Return fire</i> shoot back automatically — only the nearest two, as a snap shot at the muzzle flash (×0.8, patrol ×0.55); exposed patrol officers fall back to cover. Use the stance button to switch Return fire / Fire at will / Hold fire.')}

 ${HB('Negotiation', 'Two negotiators arrive staggered. Open contact by <b>Call</b> (needs his number — from a neighbor interview, the 911 record or family), <b>PA Contact</b> from a cruiser or a bullhorn team (he may yell from a window — or shoot), or a <b>Throw Phone</b> tossed through an open door/broken window or carried in by the robot (can be blocked, shot or ignored). He can refuse, not answer or hang up. Once talking, pick one dialogue move per turn in Intel: Build Rapport, Active Listening, Concession, Status Check, Ultimatum.')}

 ${HB('Casualties', 'a hit person may be killed (memorial marker), injured but mobile (moves to cover and walks to EMS), or immobile (needs rescue). A ✚ marker shows the critical countdown (m:ss of mission time); you only see status with vision or a radio report. <b>First Aid</b> (Medic + medkit stabilises), <b>Rescue</b> drags to cover, <b>Evacuate</b> carries to the 🚑 EMS point, then transport to hospital. Three officers hit aborts the operation.')}

 ${HB('Forces', 'patrol (P1–P4) are on scene — park them on the amber ◇ containment points. SWAT officers are paged and arrive at staging; press <b>Form Team</b>. Tap ⓘ (or a selected shield) for members, specialties, qualifications, armory and transfers.')}

  try { u = new SpeechSynthesisUtterance(l.who === '[Note]' ? l.text.replace(/\(\d{3}\) ?\d{3}-\d{4}/, 'on file') : l.text); u.rate = l.who === 'Dispatcher' ? 1.05 : 1.12; u.pitch = l.who === 'Dispatcher' ? 1.15 : 0.8;
    u.onend = () => { if (TTS.on && TTS.i === i) setTimeout(() => { if (TTS.on && TTS.i === i) speakFrom(i + 1); }, 250); }; u.onerror = () => { if (TTS.i === i) stopSpeech(); }; speechSynthesis.speak(u); } catch (e) { TTS.ok = false; stopSpeech(); } }
function open911() { const S = Core.state, B = S.brief; if (!B) return; const r = Core.review911(); refresh(true);
  $('c911-dlg').innerHTML = `<div class="ph">911 Call Record<span class="sp"></span><small>${esc(B.callAt)} · ${esc(B.addr)}</small><button class="ib" data-close="m-911">✕</button></div><div class="body">
   <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">${TTS.ok ? `<button id="c9-play" style="flex:1">▶ Play audio</button><button id="c9-skip" style="flex:1">⏭ Skip line</button><button id="c9-mute" style="flex:1">${TTS.muted ? '🔇 Unmute' : '🔈 Mute'}</button>` : '<span style="font-size:11px;color:var(--dim)">Audio playback is not supported on this browser — transcript only.</span>'}</div>
   <div>${B.transcript.map(l => `<div class="tr ${l.who === 'Caller' ? 'c' : l.who === '[Note]' ? 'n' : ''}"><span class="tt">${esc(l.t)}</span><span class="who">${esc(l.who === '[Note]' ? 'NOTE' : l.who.toUpperCase())}</span><span>${esc(l.text)}</span></div>`).join('')}</div>
   ${B.background && B.background.length ? `<div class="sh" style="margin-top:8px">Background audio</div><div style="font-size:11.5px;color:var(--dim)">${B.background.map(esc).join('<br>')}</div>` : ''}
   <div class="kv" style="margin-top:10px"><span>Phone number</span><b style="color:${S.nego.numberKnown ? 'var(--green)' : 'var(--dim)'}">${S.nego.numberKnown ? esc(B.phone || 'known') + ' · ' + esc(S.nego.numberSrc || '') : 'not obtained from this call'}</b></div>
   <div style="display:flex;gap:8px;margin-top:12px"><button id="c9-brief" style="flex:1">◂ Brief</button><button data-close="m-911" class="on" style="flex:1">Close</button></div></div>`;
  $('m-911').classList.add('show'); hiLine(); }
$('c911-dlg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'c9-play') { if (TTS.on) stopSpeech(); else { TTS.muted = false; try { speechSynthesis.cancel(); } catch (x) { } speakFrom(0); } }
  if (b.id === 'c9-skip' && TTS.on) { const i = TTS.i; try { speechSynthesis.cancel(); } catch (x) { } TTS.i = -2; setTimeout(() => speakFrom(i + 1), 60); }
  if (b.id === 'c9-mute') { TTS.muted = !TTS.muted; if (TTS.muted) stopSpeech(); b.textContent = TTS.muted ? '🔇 Unmute' : '🔈 Mute'; }
  if (b.id === 'c9-brief') { closeModal('m-911'); openBrief(); } });
$('b-brief').onclick = () => openBrief();

/* ---------------- career screen (UI only; storage lives in career.js) ---------------- */
let CAREER = Career.load(), careerNotes = null, ccConfirm = false;
function careerEndHTML() { const S = Core.state;
  if (!(S.opts && S.opts.career)) return `<p style="font-size:11px;color:var(--dim);margin:10px 0 0">Quick scenario / seed replay — not counted in your career.</p>`;
  return `<div class="sh" style="margin-top:12px">Career</div><div style="font-size:12px;color:#bcd0e6">${(careerNotes || []).map(n => `<div>• ${esc(n)}</div>`).join('') || 'Saved.'}</div>`; }
function careerRecordEnd() { const S = Core.state; if (!(S.opts && S.opts.career) || S._careerSaved) return; S._careerSaved = true;
  try { careerNotes = Career.record(CAREER, Core.careerSummary()); if (!Career.save(CAREER)) careerNotes.push('(Could not write to browser storage — export a code to keep this career.)'); } catch (e) { careerNotes = ['Career save failed: ' + e.message]; } }
function openCareer() { ccConfirm = false; renderCareer(); $('m-career').classList.add('show'); }
function renderCareer(msg) { const C = CAREER, R = C.record, S = Core.state;
  const oc = Object.entries(R.outcomes).map(([k, v]) => `${({ negotiated: 'Negotiated surrender', callout: 'Call-out', arrest: 'Arrest', tactical: 'Tactical entry', lesslethal: 'Less-lethal', officerfire: 'Officer fire', perimeter: 'Caught on perimeter', escaped: 'Escaped', timeout: 'Out of time', aborted: 'Aborted' })[k] || k} ${v}`).join(' · ') || '—';
  const roster = C.roster.slice().sort((a, b) => (a.recover > 0) - (b.recover > 0) || b.xp - a.xp).map(o => `<tr style="${o.recover > 0 ? 'opacity:.6' : ''}"><td><b>${esc(o.rank)} ${esc(o.last)}</b>${o.dog ? ` <small style="color:var(--dim)">+ ${esc(o.dog)}</small>` : ''}</td><td>${Core.SPECS[o.spec].icon} ${esc(Career.SPEC_NAME[o.spec])}${o.quals.includes('spotter') ? ' <span class="chip">◆ Spotter</span>' : ''}</td><td>${Math.round(o.skill * 100)}</td><td class="hm3">${o.xp}</td><td class="hm3">${o.missions}</td><td>${o.recover > 0 ? `<span class="pill amber">RECOVERING · ${o.recover}</span>` : '<span class="pill green">READY</span>'}</td></tr>`).join('');
  const un = Object.entries(Career.UNLOCKS).map(([k, u]) => { const own = !!C.unlocks[k]; return `<div class="ucard ${own ? 'own' : ''}"><b>${esc(u.name)}</b>${esc(u.desc)}${own ? '<div style="color:var(--green);margin-top:5px">✓ Unlocked</div>' : `<button data-buy="${k}" ${C.points >= u.cost ? '' : 'disabled'}>Unlock · ${u.cost} pts</button>`}</div>`; }).join('');
  const mem = C.memorial.length ? C.memorial.map(m => `<div>✦ <b style="color:#fff">${esc(m.rank)} ${esc(m.last)}</b> — ${esc(Career.SPEC_NAME[m.spec] || m.spec)}, ${m.missions} mission${m.missions > 1 ? 's' : ''} · ${esc(m.date)}</div>`).join('') : '<div style="color:var(--dim)">No officers lost.</div>';
  const hist = C.history.slice(0, 6).map(h => `<div>${esc(h.date.slice(0, 10))} · <span style="color:${h.win ? 'var(--green)' : 'var(--red)'}">${esc(h.title)}</span> · ${Core.tMin(h.timeSec / 30)} · ${h.score} pts · ${esc(h.grade)}</div>`).join('') || '<div style="color:var(--dim)">No missions yet.</div>';
  const replay = !(S.opts && S.opts.career) && S.phase !== 'over' ? `<button id="cc-seed" style="flex:1">Play seed ${S.seed} as career mission</button>` : '';
  const ready = Career.available(C).length;
  $('career-dlg').innerHTML = `<div class="ph">Career · SWAT Unit<span class="sp"></span><small>${C.points} PTS · SAVED IN ${esc(Career.storageKind === 'localStorage' ? 'BROWSER' : 'MEMORY ONLY')}</small><button class="ib" data-close="m-career">✕</button></div><div class="body" style="font-size:12.5px;color:#bcd0e6">
   ${msg ? `<div class="note" style="margin-bottom:8px">${esc(msg)}</div>` : ''}
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><button id="cc-start" class="on" style="flex:2" ${ready ? '' : 'disabled'}>▶ Start Career Mission <small>(new random scenario · ${ready} officers ready)</small></button>${replay}</div>
   <div class="rec"><div><b>${R.played}</b>missions</div><div><b>${R.wins}–${R.losses}</b>won–lost</div><div><b>${R.played ? Core.tMin(R.timeSec / 30 / R.played) : '—'}</b>avg time</div><div><b>${R.bestScore == null ? '—' : R.bestScore}</b>best score</div><div><b>${R.officersHit} / ${R.officersLost}</b>officers hit / lost</div><div><b>${R.patrolHit}</b>patrol hit</div><div><b>${R.suspects.unhurt} / ${R.suspects.injured} / ${R.suspects.lost}</b>suspects unhurt / injured / died</div><div><b>${C.points}</b>career points</div></div>
   <div style="font-size:11.5px;margin-top:6px"><b style="color:#fff">Outcomes:</b> ${esc(oc)}</div>
   <div class="sh" style="margin-top:12px">Roster</div><table class="ctab"><tr><th>OFFICER</th><th>SPECIALTY</th><th>SKILL</th><th class="hm3">XP</th><th class="hm3">MISSIONS</th><th>STATUS</th></tr>${roster}</table>
   <div class="sh" style="margin-top:12px">Unlocks</div><div class="ugrid">${un}</div>
   <div class="sh" style="margin-top:12px">Recent missions</div><div style="font-size:11.5px">${hist}</div>
   <div class="sh" style="margin-top:12px">Memorial</div><div style="font-size:12px">${mem}</div>
   <div class="sh" style="margin-top:12px">Save transfer</div><textarea id="cc-code" placeholder="Paste a career code here to import" spellcheck="false"></textarea>
   <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button id="cc-exp" style="flex:1">Show / copy code</button><button id="cc-dl" style="flex:1">⭳ Download file</button><button id="cc-up" style="flex:1">⭱ Load file</button><button id="cc-imp" style="flex:1">Import code</button><input type="file" id="cc-file" accept=".txt,text/plain" style="display:none"></div>
   <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px">${ccConfirm ? `<div class="warnbox">Erase this career (record, roster, unlocks, memorial)? This cannot be undone unless you exported a code.</div><div style="display:flex;gap:8px"><button id="cc-no" style="flex:1">Keep career</button><button id="cc-yes" style="flex:1;border-color:var(--red);color:var(--red)">Yes, start a new career</button></div>` : '<button id="cc-reset" style="width:100%">New Career…</button>'}</div></div>`; }
$('career-dlg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const C = CAREER;
  if (b.dataset.buy) { const r = Career.buy(C, b.dataset.buy); Career.save(C); SFX.order(); renderCareer(r.ok ? `Unlocked ${Career.UNLOCKS[b.dataset.buy].name}${r.recruit ? ' — hired Ofc. ' + r.recruit.last : ''}.` : r.reason); return; }
  if (b.id === 'cc-start') { careerNotes = null; closeModal('m-career'); newGame(0, true); }
  if (b.id === 'cc-seed') { careerNotes = null; closeModal('m-career'); newGame(Core.state.seed, true); }
  if (b.id === 'cc-exp') { const code = Career.exportCode(C); $('cc-code').value = code; $('cc-code').select(); let ok = false; try { if (navigator.clipboard) { navigator.clipboard.writeText(code).catch(() => { }); ok = true; } } catch (x) { } toast(ok ? 'Career code copied (also shown in the box)' : 'Career code shown — copy it from the box', true); }
  if (b.id === 'cc-dl') { try { const blob = new Blob([Career.exportCode(C)], { type: 'text/plain' }), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `swat-career-${new Date().toISOString().slice(0, 10)}.txt`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); } catch (x) { toast('Download not available — use the code'); } }
  if (b.id === 'cc-up') $('cc-file').click();
  if (b.id === 'cc-imp') importCareer($('cc-code').value);
  if (b.id === 'cc-reset') { ccConfirm = true; renderCareer(); }
  if (b.id === 'cc-no') { ccConfirm = false; renderCareer(); }
  if (b.id === 'cc-yes') { CAREER = Career.reset(); ccConfirm = false; renderCareer('New career started.'); } });
function importCareer(code) { try { const c = Career.importCode(code); CAREER = c; Career.save(c); renderCareer(`Imported career: ${c.record.played} missions, ${c.roster.length} officers.`); } catch (e) { renderCareer('Import failed: ' + e.message); } }
$('career-dlg').addEventListener('change', e => { if (e.target.id !== 'cc-file' || !e.target.files[0]) return; const fr = new FileReader(); fr.onload = () => importCareer(String(fr.result)); fr.readAsText(e.target.files[0]); });
$('b-career').onclick = () => openCareer();

/* ---------------- game lifecycle ---------------- */
function newGame(seed, career) { if (busy) return; seed = seed || (Math.floor(Math.random() * 999999) + 1); Core.newGame(seed, career ? Career.missionOpts(CAREER) : undefined); V.sel = null; V.mode = 'move'; V.hint = null; V.aim = null; pendingAim = null; hidePop(); $('aimbox').className = ''; logLen = -1; lastFxSound = 0; Core.state.events.length = 0;
  try { history.replaceState(null, '', '#seed=' + seed); } catch (e) { }
  if (Render.invalidate) Render.invalidate();
  document.querySelectorAll('.modal.show').forEach(m => closeModal(m.id)); onResize(); Render.fit('house'); refresh(true); openBrief(); }
let lastMini = 0;
function loop(now) { Render.frame(now); if (!busy) refresh();
  if (now - lastMini > 120) { lastMini = now; const a = $('ovw'); if (a.offsetParent) Render.drawMini(a); const b = $('ovw2'); if ($('ovwf').classList.contains('show')) Render.drawMini(b); }
  requestAnimationFrame(loop); }
Render.init(cv); setMuteIcon();
window.addEventListener('hashchange', () => { const m = /seed=(\d+)/.exec(location.hash); if (m && +m[1] !== Core.state.seed) newGame(+m[1]); });
const hs = /seed=(\d+)/.exec(location.hash); newGame(hs ? +hs[1] : 0);
requestAnimationFrame(loop);


/* test / automation hook */
window.GAME = { Core, Render, Career, get career() { return CAREER; }, openBrief, open911, openCareer, select, mapTap, action, execute, openTeamDlg, closeModal, newGame, refresh, showBreachPop, hidePop, showAim, aimInfo, get busy() { return busy; }, setPtr(t) { lastPtrType = t; } };
})();
